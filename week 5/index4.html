<!DOCTYPE html>
<html>
<head>
    <title>String Processor Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            font-family: Arial;
        }
        .container {
            background: white;
            padding: 25px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #4e73df;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #2e59d9;
        }
        .result {
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        @media (max-width: 500px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>String Processor Tool</h2>
        <textarea id="inputText" placeholder="Enter a sentence"></textarea>
        <button onclick="processString()">Process</button>
        <div class="result">
            <p id="reverseResult"></p>
            <p id="vowelResult"></p>
            <p id="longestResult"></p>
            <p id="upperResult"></p>
        </div>
    </div>
    <script>
        const reverseString = function(str) {
            return str.split("").reverse().join("");
        };
        const countVowels = (str) => {
            return str.split("").filter(char => 
                "aeiouAEIOU".includes(char)
            ).length;
        };
        const findLongestWord = function(str) {
            let words = str.split(" ");
            let longest = "";
            words.forEach(function(word) {
                if (word.length > longest.length) {
                    longest = word;
                }
            });
            return longest;
        };
        function processString() {
            let text = document.getElementById("inputText").value;

            document.getElementById("reverseResult").innerText =
                "Reverse: " + reverseString(text);

            document.getElementById("vowelResult").innerText =
                "Vowel Count: " + countVowels(text);

            document.getElementById("longestResult").innerText =
                "Longest Word: " + findLongestWord(text);

            document.getElementById("upperResult").innerText =
                "Uppercase: " + text.toUpperCase();
        }
    </script>
</body>
</html>
