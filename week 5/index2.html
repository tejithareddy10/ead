<!DOCTYPE html>
<html>
<head>
    <title>Calculator with Callback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            font-family: Arial;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .display {
            width: 100%;
            height: 50px;
            font-size: 22px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #4e73df;
            color: white;
        }
        button:hover {
            background: #2e59d9;
        }
        .equal {
            background: #1cc88a;
        }
        .clear {
            background: #e74a3b;
        }
        @media (max-width: 500px) {
            .calculator {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="setOperator('/')">÷</button>
            <button onclick="setOperator('*')">×</button>
            <button onclick="setOperator('-')">−</button>
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="setOperator('+')">+</button>
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="equal" onclick="calculateResult()">=</button>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
        </div>
    </div>
    <script>
        const add = (a, b) => a + b;
        const subtract = (a, b) => a - b;
        const multiply = (a, b) => a * b;
        const divide = (a, b) => b === 0 ? "Cannot divide by zero" : a / b;
        function calculate(num1, num2, operationCallback) {
            return operationCallback(num1, num2);
        }
        let firstNumber = "";
        let secondNumber = "";
        let operator = "";
        function appendNumber(num) {
            if (operator === "") {
                firstNumber += num;
                document.getElementById("display").value = firstNumber;
            } else {
                secondNumber += num;
                document.getElementById("display").value = firstNumber + operator + secondNumber;
            }
        }
        function setOperator(op) {
            if (firstNumber !== "") {
                operator = op;
                document.getElementById("display").value = firstNumber + operator;
            }
        }
        function clearDisplay() {
            firstNumber = "";
            secondNumber = "";
            operator = "";
            document.getElementById("display").value = "";
        }
        function calculateResult() {
            let num1 = parseFloat(firstNumber);
            let num2 = parseFloat(secondNumber);
            let callback;
            switch (operator) {
                case "+":
                    callback = add;
                    break;
                case "-":
                    callback = subtract;
                    break;
                case "*":
                    callback = multiply;
                    break;
                case "/":
                    callback = divide;
                    break;
            }
            if (callback) {
                let result = calculate(num1, num2, callback);
                document.getElementById("display").value = result;
                firstNumber = result.toString();
                secondNumber = "";
                operator = "";
            }
        }
    </script>
</body>
</html>
