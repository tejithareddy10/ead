<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Form Styling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #74caec;
        }
        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: rgb(110, 135, 247);
            border: 1px solid #55ecc6;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #b5dd58;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #e09a4a;
            color: rgb(187, 71, 96);
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: 
            #2e915a;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button>Login</button>
        </form>
    </div>
</body>
</html>
