<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>Left Section</h2>
            <p>This is the left column content. It appears side by side on desktop.</p>
        </div>
        <div class="right">
            <h2>Right Section</h2>
            <p>This is the right column content. On mobile, it moves below the left section.</p>
        </div>
    </div>
</body>
</html>
